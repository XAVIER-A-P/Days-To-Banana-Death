<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍌 Banana Death Watch</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #fef9c3; padding: 20px; }
        video, canvas, img { max-width: 100%; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        button { background: #eab308; border: none; padding: 15px 30px; font-size: 1.2rem; border-radius: 50px; cursor: pointer; color: white; margin-top: 20px; }
        #result { margin-top: 20px; font-size: 1.5rem; font-weight: bold; color: #422006; }
    </style>
</head>
<body>
    <h1>🍌 Days to Banana Death</h1>
    
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas" style="display:none;"></canvas>
    <br>
    <button id="snap">Check Banana Health</button>
    <div id="result"></div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const snap = document.getElementById('snap');
        const resultDiv = document.getElementById('result');

        // Access Camera
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(stream => { video.srcObject = stream; });

        snap.addEventListener('click', async () => {
            // Capture image
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            
            // Convert to Blob
            canvas.toBlob(async (blob) => {
                const formData = new FormData();
                formData.append('file', blob, 'banana.jpg');

                resultDiv.innerText = "Analyzing Banana Vitality...";

                // Send to API (Update URL after deployment)
                try {
                    const response = await fetch('https://YOUR-RENDER-URL.onrender.com/predict', {
                        method: 'POST',
                        body: formData
                    });
                    const data = await response.json();
                    resultDiv.innerHTML = `${data.days_left} Days Remaining<br><small>${data.message}</small>`;
                } catch (e) {
                    resultDiv.innerText = "Error: Could not reach the banana server.";
                }
            }, 'image/jpeg');
        });
    </script>
</body>
</html>
